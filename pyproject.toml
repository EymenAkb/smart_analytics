[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_analytics"
version = "0.1.0"
description = "Multi-dashboard analytics tool using Plotly and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
authors = [
    {name = "EymenAkb"}
]

[project.scripts]
launch-analytics = "smart_analytics:launch_ux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/EymenAkb/smart_analytics"
Repository = "https://github.com/EymenAkb/smart_analytics"